<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>rcsolver</title>
<link rel="stylesheet" href="./styles.css">
<!-- installable as an app: name, icon and full-screen launch for the home screen -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#eff3f8">
<meta name="apple-mobile-web-app-title" content="Cube方塊">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<main>
  <header class="top"><span class="brand">Cube Solver <span class="nowrap">魔術方塊</span></span><span class="badge warn hidden" id="mock">MOCK</span><button class="icon-btn small-btn hidden" id="home" aria-label="回到開始"><svg id="homeIcon" viewBox="0 0 24 24" width="24" height="24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><svg id="homeX" class="hidden" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></header>

  <section id="setup">
    <div class="hero hidden" id="hero">
      <canvas id="heroCube" class="hero-cube" aria-hidden="true"></canvas>
      <p class="tagline">Solve any cube</p>
    </div>
    <button type="button" class="learn-card" id="learnCard"><span class="learn-card-icon"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 11.2V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.8M22 9v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="learn-card-text"><b id="learnCardTitle">學會自己解</b><span id="learnCardSub"></span><span class="learn-bar"><span id="learnCardBar"></span></span></span><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" class="learn-card-go"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="learn-card speed-card" id="speedCard"><span class="learn-card-icon"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 13.5V9.5M10 2.5h4M18.5 6l1.5-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="learn-card-text"><b id="speedCardTitle">速轉計時</b><span id="speedCardSub"></span></span><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" class="learn-card-go"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="saves hidden" id="saves"></div>
    <div class="bottom-bar">
      <button class="side-btn import-btn" id="import" aria-label="貼上方塊狀態"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="2" width="6" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="primary shutter-main" id="start" aria-label="開始拍攝"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="side-btn study-btn" id="study" aria-label="研究模式"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 3h6M10 3v6l-5.5 9.2A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.8L14 9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
  </section>

  <section class="card hidden" id="capture">
    <div class="step-head">
      <span class="badge" id="stepCount"></span>
      <button class="icon-btn small-btn tips-btn" id="tips" aria-label="怎麼拍"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.2" fill="currentColor"/></svg></button>
    </div>
    <canvas id="guide" class="guide" aria-label="示範怎麼轉方塊的動畫"></canvas>
    <div class="viewfinder">
      <video id="video" playsinline autoplay muted></video>
      <div class="frame" id="frame"></div>
      <div class="cam-error hidden" id="camError"><svg viewBox="0 0 24 24" width="72" height="72"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    </div>
    <div class="shutter-row">
      <label class="icon-btn" aria-label="從相簿選擇"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 3 3 3-4 5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><input type="file" id="file" accept="image/*" hidden></label>
      <button class="shutter" id="shoot" aria-label="拍這一面"></button>
      <input type="file" id="fileCapture" accept="image/*" capture="environment" hidden>
      <button class="icon-btn" id="redo" aria-label="重拍上一面" disabled><svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 7H4V2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 7a8 8 0 1 1-2 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="hidden" id="review">
    <div class="thumbs big" id="reviewThumbs"></div>
    <div class="big-error hidden" id="sendError" role="alert"><svg viewBox="0 0 24 24" width="96" height="96"><path d="M12 2.5 23 21H1z" fill="#e03131"/><rect x="10.9" y="9" width="2.2" height="6" rx="1" fill="#fff"/><circle cx="12" cy="17.6" r="1.3" fill="#fff"/></svg><p class="big-error-text" id="sendErrorText">格式不正確，請重新拍照。</p></div>
    <div class="bottom-bar go-bar">
      <button class="icon-btn tall" id="retake" aria-label="重新拍攝"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="primary go" id="send">Go</button>
    </div>
  </section>

  <div class="busy hidden" id="busy" role="status" aria-label="請稍候"><span class="spinner big"></span></div>

  <section class="card hidden" id="result">
    <div class="step-head">
      <span class="badge progress-badge" id="sizeBadge"></span>
      <span class="badge warn hidden" id="invalidBadge">⚠</span>
      <button class="icon-btn" id="shareResult" aria-label="分享"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="18" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn" id="fix" aria-label="修正顏色"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M14.7 6.3a4 4 0 0 0-5.2 5.2L3 18l3 3 6.5-6.5a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.1-2.1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
    <p class="notice hidden" id="manualNote">AI 暫時無法辨識。點一面放大，照著照片填顏色。</p>
    <div class="cube-wrap">
      <canvas id="preview" class="cube" aria-label="辨識出來的方塊，可拖曳旋轉"></canvas>
      <button class="icon-btn small-btn view-btn" id="previewHome" aria-label="轉回正面"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="editor" class="editor hidden">
      <div id="net" class="net"></div>
      <div id="zoom" class="zoom hidden"></div>
      <div class="legend-row">
        <div class="legend" id="legend"></div>
        <button class="icon-btn small-btn" id="resetNet" aria-label="全部還原" disabled><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 7H4V2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 7a8 8 0 1 1-2 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <p class="fill-count hidden" id="fillCount"></p>
    </div>
    <div class="go-row">
      <button class="icon-btn" id="again" aria-label="再拍一組"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="primary go" id="solve">Go</button>
    </div>
  </section>

  <section class="hidden" id="learnMap">
    <div class="learn-head"><b id="learnMapTitle">學習</b><div class="seg" role="tablist" id="learnSizes"><button type="button" role="tab" data-size="2">2×2</button><button type="button" role="tab" data-size="3">3×3</button></div></div>
    <ol class="lesson-list" id="lessonList"></ol>
  </section>

  <section class="card hidden" id="learnView">
    <div class="learn-top">
      <button class="icon-btn small-btn" id="learnBack" aria-label="回到關卡地圖"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div class="learn-top-text"><b id="lessonTitle"></b><span id="lessonCount"></span><div class="learn-steps"><i id="learnStepWatch"></i><i id="learnStepPractice"></i></div></div>
    </div>
    <p class="lesson-text" id="lessonText"></p>
    <div class="cube-wrap">
      <canvas id="learnCube" class="cube" aria-label="教學用的方塊"></canvas>
      <span class="learn-flip hidden" id="learnFlip" role="status"></span>
      <div class="learn-ok hidden" id="learnOk" aria-hidden="true"><svg viewBox="0 0 24 24" width="64" height="64"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <!-- the cube's tools sit under it, out of the way of the fingers turning it -->
    <div class="learn-tools">
      <button class="tool-btn reset-btn hidden" id="learnReset"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="learnResetLabel">重設</span></button>
      <span class="learn-moves hidden" id="learnMoves"></span>
      <button class="tool-btn hint-btn hidden" id="learnHint"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="learnHintLabel">提示</span></button>
    </div>
    <p class="lesson-tip hidden" id="lessonTip" role="status"></p>
    <div class="lesson-demos" id="lessonDemos"></div>
    <div class="lesson-keys hidden" id="lessonKeys"></div>
    <button class="primary go" id="lessonGo"></button>
  </section>

  <section class="hidden" id="learnDone">
    <div class="done-stars" id="doneStars" role="img"></div>
    <b class="done-title" id="doneTitle"></b>
    <div class="done-stats" id="doneStats"></div>
    <div class="done-next hidden" id="doneNext"></div>
    <div class="done-buttons">
      <button class="primary go" id="doneNextBtn"></button>
      <div class="done-row"><button id="doneAgain"></button><button id="doneMap"></button></div>
    </div>
  </section>

  <section class="card hidden" id="solveView">
    <div class="step-head">
      <span class="badge progress-badge" id="progress"></span>
      <button class="icon-btn solve-only study-entry" id="toStudy" aria-label="研究模式"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 3h6M10 3v6l-5.5 9.2A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.8L14 9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn study-only" id="studyHelp" aria-label="說明"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.4" fill="currentColor"/></svg></button>
      <button class="icon-btn study-only back-solve hidden" id="backToSolve" aria-label="回到求解"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="shareSolve" aria-label="分享"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="18" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn" id="save" aria-label="儲存"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 3h11l3 3v15H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 3v6h7V3M8 21v-7h8v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="stages-row solve-only hidden" id="stagesRow"><div class="stages" id="stages"></div></div>
    <div class="guide-text solve-only hidden" id="guideText"><b id="guideTitle"></b><span id="guideBody"></span>
    </div>
    <div class="cube-wrap">
      <canvas id="cube" class="cube" aria-label="可拖曳旋轉視角的方塊"></canvas>
      <button class="icon-btn small-btn guide-btn solve-only hidden" id="guideBtn" aria-label="導覽模式"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.2" fill="currentColor"/></svg></button>
      <button class="icon-btn small-btn twist-btn study-only" id="twistBtn" aria-label="手轉" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9a9 9 0 0 1 9-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10.5 1l2.6 1.6-1.8 2.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 15a9 9 0 0 1-9 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.5 23l-2.6-1.6 1.8-2.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn small-btn guide-btn study-only" id="studyFocusBtn" aria-label="只看標記的塊" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg></button>
      <button class="icon-btn small-btn view-btn" id="viewHome" aria-label="轉回正面"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="move-row">
      <div class="move" id="move"></div>
      <div class="angle" id="angle"></div>
      <button class="icon-btn small-btn play-toggle study-only" id="playToggle" aria-label="收起播放列" aria-expanded="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="slider-row" id="sliderRow">
      <button class="icon-btn small-btn pace" id="pace" aria-label="每步停留時間"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="paceValue">3s</span></button>
      <input type="range" class="slider" id="slider" min="0" max="0" value="0" step="1" aria-label="步驟">
    </div>
    <div class="play-row">
      <button class="icon-btn" id="prev" aria-label="上一步"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn play" id="play" aria-label="自動播放"><svg id="playIcon" viewBox="0 0 24 24" width="30" height="30"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg><svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="30" height="30"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg></button>
      <button class="icon-btn primary next" id="next" aria-label="下一步"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="done solve-only hidden" id="done">
      <div class="check">✓</div>
      <button class="primary go" id="restart" aria-label="再來一次"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <div class="sequence-row">
      <div class="sequence" id="sequence"></div>
      <button class="icon-btn small-btn" id="copySeq" aria-label="複製整段轉法"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <div class="study-input study-only" id="studyInput">
      <div class="study-text-row" id="studyTextRow"><input class="study-text" id="studyText" type="text" placeholder="R U R' U'" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="轉法"><button type="button" class="icon-btn small-btn study-del" id="studyDel" aria-label="刪除最後一步（長按全部刪除）"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5l5 5M17 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <div class="keys" id="studyKeys"></div>
      <div class="macro-row" id="studyMacros"></div>
      <div class="krow three" id="studyTurns"><button type="button" class="k" data-tok="x">x</button><button type="button" class="k" data-tok="y">y</button><button type="button" class="k" data-tok="z">z</button></div>
      <div class="study-tip hidden" id="studyTip" role="status"><div class="study-tip-text"><b id="studyTipTitle"></b><span id="studyTipBody"></span></div><button type="button" class="study-tip-learn hidden" id="studyTipLearn">去學這一關</button></div>
      <div class="study-go-row"><button type="button" class="study-hint" id="studyHint" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="studyHintLabel">提示</span></button><button class="primary go" id="studyGo" aria-label="求解">Go</button></div>
    </div>
  </section>

</main>

<div class="speed hidden" id="speed" data-phase="idle">
  <div class="speed-main">
    <div class="speed-left">
      <div class="speed-head"><button type="button" class="icon-btn speed-close" id="speedClose" aria-label="離開速轉模式"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><div class="speed-clock"><span id="speedTime"></span><span id="speedNote"></span></div></div>
      <div class="speed-pad" id="speedPad">
        <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M24 3v8M24 37v8M3 24h8M37 24h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M20 7l4-4 4 4M20 41l4 4 4-4M7 20l-4 4 4 4M41 20l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="speedPadTitle"></span>
      </div>
      <div class="speed-records">
        <b id="speedRecordsTitle"></b>
        <ol id="speedRecordList"></ol>
        <p><span id="speedBest"></span><span id="speedAvg"></span></p>
      </div>
    </div>
    <div class="speed-panel">
      <canvas id="speedCube" aria-label="速轉用的方塊"></canvas>
      <div class="speed-tools"><button type="button" id="speedSize" aria-label="換方塊大小"></button><button type="button" class="primary" id="speedScramble"></button></div>
      <div class="speed-result" role="status">
        <span class="speed-badge" id="speedResultBadge"></span>
        <b id="speedResultTime"></b>
        <span id="speedResultMoves"></span>
        <button type="button" class="primary" id="speedAgain"></button>
      </div>
    </div>
  </div>
  <div class="speed-rotate">
    <button type="button" class="icon-btn speed-close" id="speedClose2" aria-label="離開速轉模式"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <svg viewBox="0 0 160 160" width="150" height="150" aria-hidden="true"><rect x="52" y="22" width="56" height="100" rx="10" fill="none" stroke="#b8c6d9" stroke-width="4" stroke-dasharray="6 6"/><rect x="30" y="70" width="100" height="56" rx="10" fill="#fff" stroke="#195ed6" stroke-width="4"/><path d="M 120 34 A 46 46 0 0 1 142 72" fill="none" stroke="#195ed6" stroke-width="4" stroke-linecap="round"/><polygon points="146,84 134,70 150,66" fill="#195ed6"/></svg>
    <b id="speedRotateTitle"></b>
    <span id="speedRotateSub"></span>
  </div>
</div>
<dialog id="importDialog" class="dialog">
  <form method="dialog" class="dialog-body">
    <p class="dialog-title">貼上方塊狀態或分享連結<br><span class="muted">Paste a cube state or a shared link</span></p>
    <textarea id="importText" rows="4" spellcheck="false" autocapitalize="characters" placeholder="UUUUUUUUURRRRRRRRRFFFFFFFFF…"></textarea>
    <p class="muted small-hint hidden" id="importError">✕ 看不懂這段內容 / Not a cube state</p>
    <div class="go-row">
      <button type="button" class="icon-btn" id="importCancel" aria-label="取消"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button type="submit" class="primary go" id="importOk">Go</button>
    </div>
  </form>
</dialog>
<dialog id="tipsDialog" class="dialog tips" aria-label="怎麼拍">
  <form method="dialog" class="dialog-body">
    <div class="tip big"><canvas data-tip="good"></canvas><span class="mark ok"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="tips-row">
      <div class="tip"><canvas data-tip="angled"></canvas><span class="mark no"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span></div>
      <div class="tip"><canvas data-tip="far"></canvas><span class="mark no"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span></div>
    </div>
    <button class="primary go" id="tipsOk">OK</button>
  </form>
</dialog>
<dialog id="titleDialog" class="dialog" aria-label="改標題">
  <form method="dialog" class="dialog-body">
    <input id="titleInput" class="title-input" type="text" maxlength="40" autocomplete="off" enterkeyhint="done">
    <div class="go-row">
      <button type="button" class="icon-btn" id="titleCancel" aria-label="取消"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button type="submit" class="primary go">OK</button>
    </div>
  </form>
</dialog>
<dialog id="sizeDialog" class="dialog" aria-label="選方塊大小">
  <div class="dialog-body">
    <div class="ai-fail hidden" id="aiFailHead">
      <p class="dialog-title"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3l9 16H3z" fill="#e0a21c"/><rect x="11" y="9" width="2" height="5" rx="1" fill="#fff"/><circle cx="12" cy="16.4" r="1.1" fill="#fff"/></svg><span id="aiFailTitle">AI 暫時無法辨識</span></p>
      <p class="muted" id="aiFailText">選方塊大小，接著照著照片自己填顏色。</p>
    </div>
    <div class="size-grid" id="sizeGrid"></div>
    <button type="button" class="link-btn hidden" id="aiRetry">再試一次 AI</button>
  </div>
</dialog>
<dialog id="leaveDialog" class="dialog leave" aria-label="回到開始">
  <div class="dialog-body">
    <p class="dialog-title" id="leaveTitle">回到首頁？</p>
    <p class="muted" id="leaveText"></p>
    <div class="leave-row"><button type="button" id="leaveCancel">取消</button><button type="button" class="primary" id="leaveGo">回首頁</button></div>
  </div>
</dialog>
<dialog id="macroDialog" class="dialog" aria-label="自訂公式">
  <div class="dialog-body">
    <div class="macro-head"><p class="dialog-title" id="macroTitle">自訂公式</p><button type="button" class="icon-btn small-btn" id="macroClose" aria-label="取消"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
    <p class="muted" id="macroNote"></p>
    <div class="macro-rows" id="macroRows"></div>
    <div class="macro-ai" id="macroAi">
      <button type="button" class="macro-ai-toggle" id="macroAiToggle" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/></svg><span id="macroAiLabel">問 AI</span><svg class="macro-ai-chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="macro-ai-box" id="macroAiBox">
        <input class="macro-ai-text" id="macroAiText" type="text" autocomplete="off" enterkeyhint="send" maxlength="200">
        <button type="button" class="macro-ai-send" id="macroAiSend" aria-label="送出"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="spinner"></span></button>
      </div>
      <p class="macro-error hidden" id="macroAiError" role="status"></p>
    </div>
    <p class="macro-error hidden" id="macroError"></p>
    <button type="button" class="primary macro-save" id="macroSave">儲存</button>
  </div>
</dialog>
<dialog id="tourDialog" class="tour" aria-label="說明">
  <div class="tour-spot"></div>
  <div class="tour-bubble">
    <p class="tour-head"><span class="tour-count"></span><b class="tour-title"></b></p>
    <p class="tour-body"></p>
    <div class="tour-nav"><span class="tour-dots"></span><button type="button" class="tour-skip">略過</button><button type="button" class="primary tour-next">下一步</button></div>
  </div>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
