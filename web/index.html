<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>rcsolver</title>
<link rel="stylesheet" href="./styles.css">
<!-- installable as an app: name, icon and full-screen launch for the home screen -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#eff3f8">
<meta name="apple-mobile-web-app-title" content="Cube方塊">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<main>
  <header class="top"><span class="brand">Rubik Cube Solver <span class="nowrap">魔術方塊</span></span><span class="badge warn hidden" id="mock">MOCK</span><button class="icon-btn small-btn hidden" id="import" aria-label="貼上方塊狀態"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="2" width="6" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>

  <section id="setup">
    <div class="hero hidden" id="hero">
      <canvas id="heroCube" class="hero-cube" aria-hidden="true"></canvas>
      <p class="tagline">Solve any cube</p>
    </div>
    <div class="saves hidden" id="saves"></div>
    <div class="bottom-bar">
      <button class="primary shutter-main" id="start" aria-label="開始拍攝"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="study-btn" id="study" aria-label="研究模式"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 3h6M10 3v6l-5.5 9.2A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.8L14 9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
  </section>

  <section class="card hidden" id="capture">
    <div class="step-head">
      <span class="badge" id="stepCount"></span>
      <button class="icon-btn small-btn tips-btn" id="tips" aria-label="怎麼拍"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.2" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="cancel" aria-label="回到開始"><svg id="cancelHome" viewBox="0 0 24 24" width="24" height="24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><svg id="cancelX" class="hidden" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <canvas id="guide" class="guide" aria-label="示範怎麼轉方塊的動畫"></canvas>
    <div class="viewfinder">
      <video id="video" playsinline autoplay muted></video>
      <div class="frame" id="frame"></div>
      <div class="cam-error hidden" id="camError"><svg viewBox="0 0 24 24" width="72" height="72"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    </div>
    <div class="shutter-row">
      <label class="icon-btn" aria-label="從相簿選擇"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 3 3 3-4 5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><input type="file" id="file" accept="image/*" hidden></label>
      <button class="shutter" id="shoot" aria-label="拍這一面"></button>
      <input type="file" id="fileCapture" accept="image/*" capture="environment" hidden>
      <button class="icon-btn" id="redo" aria-label="重拍上一面" disabled><svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 7H4V2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 7a8 8 0 1 1-2 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="hidden" id="review">
    <div class="step-head"><button class="icon-btn" id="homeReview" aria-label="回到開始"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
    <div class="thumbs big" id="reviewThumbs"></div>
    <p class="muted center" id="sendStatus"></p>
    <div class="big-error hidden" id="sendError" role="alert"><svg viewBox="0 0 24 24" width="96" height="96"><path d="M12 2.5 23 21H1z" fill="#e03131"/><rect x="10.9" y="9" width="2.2" height="6" rx="1" fill="#fff"/><circle cx="12" cy="17.6" r="1.3" fill="#fff"/></svg><p class="big-error-text" id="sendErrorText">格式不正確，請重新拍照。</p></div>
    <div class="bottom-bar go-bar">
      <button class="icon-btn tall" id="retake" aria-label="重新拍攝"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="primary go" id="send">Go</button>
    </div>
  </section>

  <div class="busy hidden" id="busy" role="progressbar"><div class="busy-box"><span class="spinner big"></span><div class="bar"><div id="busyBar"></div></div></div></div>

  <section class="card hidden" id="result">
    <div class="step-head">
      <span class="badge progress-badge" id="sizeBadge"></span>
      <span class="badge warn hidden" id="invalidBadge">⚠</span>
      <button class="icon-btn" id="shareResult" aria-label="分享"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="18" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn" id="fix" aria-label="修正顏色"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M14.7 6.3a4 4 0 0 0-5.2 5.2L3 18l3 3 6.5-6.5a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.1-2.1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="homeResult" aria-label="回到開始"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
    <canvas id="preview" class="cube" aria-label="辨識出來的方塊，可拖曳旋轉"></canvas>
    <div id="editor" class="editor hidden">
      <div id="net" class="net"></div>
      <div id="zoom" class="zoom hidden"></div>
      <div class="legend-row">
        <div class="legend" id="legend"></div>
        <button class="icon-btn small-btn" id="resetNet" aria-label="全部還原" disabled><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 7H4V2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 7a8 8 0 1 1-2 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="go-row">
      <button class="icon-btn" id="again" aria-label="再拍一組"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn hidden" id="teach" aria-label="教學模式：一層一層慢慢解"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M2 9l10-5 10 5-10 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 11.2V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.8M22 9v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="primary go" id="solve">Go</button>
    </div>
  </section>

  <section class="card hidden" id="solveView">
    <div class="step-head">
      <span class="badge progress-badge" id="progress"></span>
      <span class="mode-tag study-only" id="studyTag">研究</span>
      <button class="icon-btn solve-only study-entry" id="toStudy" aria-label="研究模式"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 3h6M10 3v6l-5.5 9.2A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.8L14 9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn solve-only" id="shareSolve" aria-label="分享"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="18" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn solve-only" id="save" aria-label="儲存"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 3h11l3 3v15H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 3v6h7V3M8 21v-7h8v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="closeSolve" aria-label="回到開始"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="stages-row solve-only hidden" id="stagesRow"><div class="stages" id="stages"></div></div>
    <div class="guide-text solve-only hidden" id="guideText"><b id="guideTitle"></b><span id="guideBody"></span>
      <div class="guide-alg hidden" id="guideAlgRow"><code id="guideAlg"></code><button class="icon-btn small-btn" id="replayAlg" aria-label="再看一次這條公式"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 12a8 8 0 1 1 2.3 5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 18v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>
    <div class="cube-wrap">
      <canvas id="cube" class="cube" aria-label="可拖曳旋轉視角的方塊"></canvas>
      <button class="icon-btn small-btn guide-btn solve-only hidden" id="guideBtn" aria-label="導覽模式"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.2" fill="currentColor"/></svg></button>
    </div>
    <div class="move-row">
      <div class="move" id="move"></div>
      <div class="angle" id="angle"></div>
    </div>
    <input type="range" class="slider" id="slider" min="0" max="0" value="0" step="1" aria-label="步驟">
    <div class="play-row">
      <button class="icon-btn" id="prev" aria-label="上一步"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn play" id="play" aria-label="自動播放"><svg id="playIcon" viewBox="0 0 24 24" width="30" height="30"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg><svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="30" height="30"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg></button>
      <button class="icon-btn primary next" id="next" aria-label="下一步"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="done solve-only hidden" id="done">
      <div class="check">✓</div>
      <button class="primary go" id="restart" aria-label="再來一次"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <div class="sequence-row">
      <button class="icon-btn small-btn pace" id="pace" aria-label="每步停留時間"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="paceValue">3s</span></button>
      <div class="sequence" id="sequence"></div>
      <button class="icon-btn small-btn" id="copySeq" aria-label="複製整段轉法"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <div class="study-input study-only" id="studyInput">
      <input class="study-text" id="studyText" type="text" placeholder="R U R' U'" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="轉法">
      <div class="keys" id="studyKeys"></div>
      <button class="primary go" id="studyGo" aria-label="求解">Go</button>
    </div>
  </section>

</main>
<dialog id="importDialog" class="dialog">
  <form method="dialog" class="dialog-body">
    <p class="dialog-title">貼上方塊狀態或分享連結<br><span class="muted">Paste a cube state or a shared link</span></p>
    <textarea id="importText" rows="4" spellcheck="false" autocapitalize="characters" placeholder="UUUUUUUUURRRRRRRRRFFFFFFFFF…"></textarea>
    <p class="muted small-hint hidden" id="importError">✕ 看不懂這段內容 / Not a cube state</p>
    <div class="go-row">
      <button type="button" class="icon-btn" id="importCancel" aria-label="取消"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button type="submit" class="primary go" id="importOk">Go</button>
    </div>
  </form>
</dialog>
<dialog id="tipsDialog" class="dialog tips" aria-label="怎麼拍">
  <form method="dialog" class="dialog-body">
    <div class="tip big"><canvas data-tip="good"></canvas><span class="mark ok"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="tips-row">
      <div class="tip"><canvas data-tip="angled"></canvas><span class="mark no"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span></div>
      <div class="tip"><canvas data-tip="far"></canvas><span class="mark no"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span></div>
    </div>
    <button class="primary go" id="tipsOk">OK</button>
  </form>
</dialog>
<dialog id="titleDialog" class="dialog" aria-label="改標題">
  <form method="dialog" class="dialog-body">
    <input id="titleInput" class="title-input" type="text" maxlength="40" autocomplete="off" enterkeyhint="done">
    <div class="go-row">
      <button type="button" class="icon-btn" id="titleCancel" aria-label="取消"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button type="submit" class="primary go">OK</button>
    </div>
  </form>
</dialog>
<dialog id="sizeDialog" class="dialog" aria-label="選方塊大小">
  <div class="dialog-body"><div class="size-grid" id="sizeGrid"></div></div>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
