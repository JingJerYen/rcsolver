# Cloudflare Workers deployment. One-time setup is in README.md; after that every push to main deploys.
# The API key is a Worker secret (dashboard or `npx wrangler secret put RCSOLVER_ANTHROPIC_KEY`), never this file.
name = "rcsolver"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# `wrangler deploy` bundles the web page first, so no separate build step is needed anywhere.
[build]
command = "npm run build:web"

# Run the API in the US. Left to the nearest data centre, phones in Taiwan are sometimes served from
# Hong Kong, where the Anthropic API answers 403 "Request not allowed". Static files still come from
# the nearest data centre; only /api/* runs here, and one long model call barely notices the hop.
[placement]
region = "aws:us-east-1"

[observability]
enabled = true

# Pushes to branches other than main run `wrangler preview`, which needs this block (it can stay empty).
[previews]

[assets]
directory = "./public"
# Only API paths run the Worker; everything else is served straight from ./public.
run_worker_first = ["/api/*"]

[vars]
RECOGNIZE_MODEL = "claude-opus-5-5"
RECOGNIZE_EFFORT = "medium"
# custom sequences written from plain words (the study mode "Ask AI"); share DAILY_LIMIT with photos
MACRO_MODEL = "claude-sonnet-5-5"
MACRO_EFFORT = "medium"
MACRO_TIMEOUT_MS = "60000"
RATE_LIMIT_PER_MIN = "6"
DAILY_LIMIT = "100"

# Optional: a KV namespace makes the daily cap count across all isolates.
# Create one with `npx wrangler kv namespace create QUOTA` and paste the id here.
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "..."
