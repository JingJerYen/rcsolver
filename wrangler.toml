# Cloudflare Workers deployment. One-time setup is in README.md; after that every push to main deploys.
# The API key is a Worker secret (dashboard or `npx wrangler secret put RCSOLVER_ANTHROPIC_KEY`), never this file.
name = "rcsolver"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# `wrangler deploy` bundles the web page first, so no separate build step is needed anywhere.
[build]
command = "npm run build:web"

[observability]
enabled = true

[assets]
directory = "./public"
# Only API paths run the Worker; everything else is served straight from ./public.
run_worker_first = ["/api/*"]

[vars]
RECOGNIZE_MODEL = "claude-opus-5-5"
RECOGNIZE_EFFORT = "medium"
RATE_LIMIT_PER_MIN = "6"
DAILY_LIMIT = "100"

# Optional: a KV namespace makes the daily cap count across all isolates.
# Create one with `npx wrangler kv namespace create QUOTA` and paste the id here.
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "..."
